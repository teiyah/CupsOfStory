<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cups of Story</title>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LRSCFV12XM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-LRSCFV12XM');
  </script>

  <link rel="icon" href="images/cosLogo.png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/26e7e163d1.js" crossorigin="anonymous"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="css/style.css">

  <style>
    * { box-sizing: border-box; }

    body {
      background-color: #1C1408;
      color: #E8E0D0;
      margin: 0;
    }

    /* ===== TOP NAV ===== */
    .top-nav {
      background-color: #1C1408;
      border-bottom: 1px solid #2e2a1e;
      padding: 0.6rem 0;
    }
    .top-nav .container {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }
    .top-nav a {
      color: #9a8e78;
      text-decoration: none;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .top-nav a:hover { color: #E8E0D0; }
    /* Index dropdown */
    .top-nav .nav-links {
      display: flex;
      align-items: center;
      gap: 2rem;
      position: relative;
    }
    .index-toggle {
      cursor: pointer;
      color: #9a8e78;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .index-toggle:hover { color: #E8E0D0; }
    #indexDropdown {
      display: none;
      position: absolute;
      top: calc(100% + 0.8rem);
      right: 0;
      background-color: #1C1408;
      border: 1px solid #2e2a1e;
      padding: 0.75rem 1.25rem;
      z-index: 1050;
      min-width: 180px;
      max-width: calc(100vw - 2rem);
    }
    #indexDropdown.open { display: block; }
    #indexDropdown a {
      display: block;
      color: #9a8e78;
      text-decoration: none;
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      text-transform: none;
      padding: 0.2rem 0;
    }
    #indexDropdown a:hover { color: #E8E0D0; }

    /* ===== HERO ===== */
    .hero-section {
      padding: 2rem 1rem 0.7rem;
      text-align: center;
    }
    .hero-section h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 2.8rem;
      color: #E8E0D0;
      margin-bottom: 0.3rem;
      letter-spacing: 0.03em;
    }
    .hero-section p {
      font-size: 0.88rem;
      color: #9a8e78;
      font-weight: 300;
      margin-bottom: 0;
    }
    .main-logo {
      max-width: 80px;
      margin-bottom: 0.75rem;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    /* ===== CARDS GRID ===== */
    .album {
      background-color: #1C1408 !important;
      padding: 0.95rem 0 3rem;
    }

    /* ===== TILE ===== */
    .story-card-tile {
      cursor: pointer;
      display: block;
      text-decoration: none;
      border-radius: 0 !important;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      overflow: hidden;
      transition: opacity 0.2s ease;
      height: 210px;
      width: 100%;
    }
    .story-card-tile:hover { opacity: 0.82; }
    .story-card-tile svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Strip all Bootstrap card decoration from tiles */
    .col .tile-wrapper,
    .col .tile-wrapper * {
      box-shadow: none !important;
      border: none !important;
      outline: none !important;
    }
    .col > a { box-shadow: none !important; }

    /* COS number overlay — HTML not SVG, so it never clips */
    .tile-wrapper {
      position: relative;
      display: block;
      height: 210px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .tile-wrapper svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
    }
    .tile-cos-label {
      position: absolute;
      top: 8px;
      right: 10px;
      font-family: Georgia, serif;
      font-size: 10px;
      letter-spacing: 0.08em;
      opacity: 0.5;
      pointer-events: none;
      white-space: nowrap;
      z-index: 2;
    }

    /* Kill any Bootstrap card borders/shadows on tile wrappers */
    .row .col .tile-wrapper {
      box-shadow: none !important;
      border: none !important;
      border-radius: 0 !important;
    }

    /* ===== SCROLL TO TOP ===== */
    #scrollTopBtn {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      right: 20px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: #404038;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
      padding: 0;
      line-height: 1;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #scrollTopBtn.visible {
      opacity: 0.75;
      pointer-events: auto;
    }
    #scrollTopBtn:hover {
      opacity: 1;
    }

    /* ===== FOOTER ===== */
    footer {
      background-color: #1C1408;
      border-top: 1px solid #2e2a1e;
      color: #5a5040;
      padding: 1.5rem 0;
    }
    footer a { color: #9a8e78; text-decoration: none; }
    footer a:hover { color: #E8E0D0; }

    /* ===== MODAL ===== */
    .modal-content {
      border-radius: 0;
      border: none;
    }
    .modal-header {
      border-bottom: none;
      padding: 1rem 1.25rem 0.5rem;
    }
    .modal-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 0.95rem;
      color: #C9A84C;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .btn-close {
      width: 0.6em;
      height: 0.6em;
      opacity: 0.4;
    }
    .modal-body {
      color: #F0EDE8;
      font-size: 17px;
      line-height: 1.75;
      padding: 0.5rem 1.25rem 1rem;
    }
    .modal-body p {
      margin-top: 0;
      margin-bottom: 1.4em;
    }
    .modal-body p:first-child {
      margin-top: 0;
    }
    .modal-body p:last-child {
      margin-bottom: 0;
    }
    .modal-footer {
      border-top: none;
      padding: 0.5rem 1.25rem 1rem;
      justify-content: flex-end;
    }
    /* Next/Close as plain text link — no box */
    .next-story-btn {
      background: none !important;
      border: none !important;
      box-shadow: none !important;
      color: #C9A84C !important;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      padding: 0;
      cursor: pointer;
      text-decoration: none;
    }
    .next-story-btn:hover {
      color: #E8E0D0 !important;
    }
  </style>
</head>

<body>

<!-- ===== TOP NAV ===== -->
<nav class="top-nav">
  <div class="container" style="position:relative;">
    <div class="nav-links">
      <div class="index-toggle" id="indexToggle">Index ▾
        <div id="indexDropdown">
          <div id="nav-index-links"></div>
        </div>
      </div>
      <a href="https://www.instagram.com/cupsofstory/" target="_blank">
        <i class="fab fa-instagram"></i> Instagram
      </a>
    </div>
  </div>
</nav>

<!-- ===== HERO ===== -->
<main>
  <section class="hero-section">
    <div class="col-lg-6 col-md-8 mx-auto">
      <img class="main-logo" src="images/cosLogo.png" alt="Cups of Story logo">
      <h1>Cups of Story</h1>
      <p>Left nameless in the world.</p>
    </div>
  </section>

  <!-- ===== CARDS GRID ===== -->
  <div class="album">
    <div class="container">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3" id="story-grid"></div>
    </div>
  </div>
</main>

<!-- ===== SCROLL TO TOP ===== -->
<button id="scrollTopBtn" aria-label="Scroll to top">☕</button>

<!-- ===== MODAL CONTAINER ===== -->
<div id="modal-container"></div>

<!-- ===== FOOTER ===== -->
<footer>
  <div class="container text-center">
    <p class="mb-1" style="font-size:0.8rem;">© Cups of Story</p>
    <small>
      <a href="https://www.instagram.com/cupsofstory/" target="_blank">
        <i class="fab fa-instagram"></i> Instagram
      </a>
    </small>
  </div>
</footer>

<!-- ===== JAVASCRIPT ===== -->
<script>
  // Index dropdown toggle
  document.getElementById('indexToggle').addEventListener('click', function(e) {
    e.stopPropagation();
    document.getElementById('indexDropdown').classList.toggle('open');
  });
  document.addEventListener('click', function() {
    document.getElementById('indexDropdown').classList.remove('open');
  });

  async function loadStories() {
    const res = await fetch('stories.json');
    const stories = await res.json();

    const grid = document.getElementById('story-grid');
    const modalContainer = document.getElementById('modal-container');
    const navLinks = document.getElementById('nav-index-links');

    // Build nav index in groups of 10
    const groupSize = 10;
    for (let i = 0; i < stories.length; i += groupSize) {
      const first = stories[i].id;
      const last = stories[Math.min(i + groupSize - 1, stories.length - 1)].id;
      const a = document.createElement('a');
      a.href = `#cos-${first}`;
      a.textContent = `COS ${last} – ${first}`;
      a.addEventListener('click', () => document.getElementById('indexDropdown').classList.remove('open'));
      navLinks.appendChild(a);
    }

    stories.forEach((story, index) => {
      const cosId = `cos${story.id}`;
      const wordLabel = story.wordCount ? `${story.wordCount} words` : '';

      // ── Tile preview text ──
      // Read directly from story.preview — set this field in stories.json
      // to control exactly what appears on each tile. No parsing, no limits.
      const preview = story.preview || story.text.split('\n')[0];

      // ── SVG text layout ──
      // Word-wrap preview into lines of ~35 chars, max 3 lines, vertically centred.
      const svgMaxLineLen = 35;
      const allWords = preview.split(' ');
      const svgLines = [];
      let currentLine = '';
      for (const w of allWords) {
        const candidate = currentLine ? currentLine + ' ' + w : w;
        if (candidate.length > svgMaxLineLen && currentLine) {
          svgLines.push(currentLine);
          currentLine = w;
        } else {
          currentLine = candidate;
        }
      }
      if (currentLine) svgLines.push(currentLine);
      const displayLines = svgLines.slice(0, 3);
      const totalLines = displayLines.length;
      const lineHeight = 1.4;
      const startDy = -((totalLines - 1) * lineHeight / 2) + 'em';
      const svgText = displayLines.map((line, i) =>
        i === 0
          ? `<tspan x="50%" dy="${startDy}">${line}</tspan>`
          : `<tspan x="50%" dy="${lineHeight}em">${line}</tspan>`
      ).join('');

      // ── Card ──
      const cardCol = document.createElement('div');
      cardCol.className = 'col';
      const isGroupStart = index % groupSize === 0;
      if (isGroupStart) cardCol.id = `cos-${story.id}`;

      cardCol.innerHTML = `
        <div class="tile-wrapper" data-bs-toggle="modal" data-bs-target="#${cosId}" style="cursor:pointer;">
          <span class="tile-cos-label" style="color:${story.textColor};">COS ${story.id}</span>
          <svg class="story-card-tile" width="100%" height="210" viewBox="0 0 400 210"
            preserveAspectRatio="xMidYMid slice"
            xmlns="http://www.w3.org/2000/svg">
            <rect width="100%" height="100%" fill="${story.backgroundColor}" />
            <text x="50%" y="50%"
              fill="${story.textColor}"
              font-family="Georgia, serif" font-size="14.5"
              text-anchor="middle" dominant-baseline="middle"
              font-weight="normal">
              ${svgText}
            </text>
          </svg>
        </div>
      `;
      grid.appendChild(cardCol);

      // ── Format story body ──
      const formattedText = story.text
        .split('\n\n')
        .map(para => `<p>${para.replace(/\n/g, '<br>')}</p>`)
        .join('');

      // ── Next story logic (reading: oldest → newest) ──
      const nextStory = stories[index - 1];
      const isLast = index === 0;
      const nextCosId = nextStory ? `cos${nextStory.id}` : null;

      // ── Modal ──
      const modalDiv = document.createElement('div');
      modalDiv.innerHTML = `
        <div class="modal fade" id="${cosId}" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content" style="background-color:${story.backgroundColor};">
              <div class="modal-header">
                <span class="modal-title">COS ${story.id}</span>
                <button type="button" class="btn-close" data-bs-dismiss="modal"
                  aria-label="Close"
                  style="filter:${isDark(story.backgroundColor) ? 'invert(1)' : 'none'}; opacity:0.35; transform:scale(0.75);"></button>
              </div>
              <div class="modal-body" style="color:${ensureContrast('${story.backgroundColor}', '#F0EDE8', 4.5)};">${formattedText}</div>
              <div class="modal-footer">
                <small style="color:${story.textColor}; opacity:0.4; margin-right:auto;">${wordLabel}</small>
                ${isLast
                  ? `<button type="button" class="next-story-btn" data-bs-dismiss="modal">Close</button>`
                  : `<button type="button" class="next-story-btn" data-bs-dismiss="modal" data-next="#${nextCosId}">Next Story →</button>`
                }
              </div>
            </div>
          </div>
        </div>
      `;
      modalContainer.appendChild(modalDiv);
    });
  }

  // Next Story handler
  document.getElementById('modal-container').addEventListener('click', function(e) {
    const btn = e.target.closest('.next-story-btn');
    if (!btn) return;
    const nextTarget = btn.getAttribute('data-next');
    if (!nextTarget) return;
    document.addEventListener('hidden.bs.modal', function handler() {
      document.removeEventListener('hidden.bs.modal', handler);
      const nextModalEl = document.querySelector(nextTarget);
      if (nextModalEl) {
        const body = nextModalEl.querySelector('.modal-body');
        if (body) body.scrollTop = 0;
        new bootstrap.Modal(nextModalEl).show();
      }
    });
  });

  // Scroll to top button
  const scrollBtn = document.getElementById('scrollTopBtn');
  window.addEventListener('scroll', function() {
    if (window.scrollY > 300) {
      scrollBtn.classList.add('visible');
    } else {
      scrollBtn.classList.remove('visible');
    }
  });
  scrollBtn.addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // Contrast ratio helpers
  function hexToRgb(hex) {
    const c = hex.replace('#', '');
    return [parseInt(c.substring(0,2),16), parseInt(c.substring(2,4),16), parseInt(c.substring(4,6),16)];
  }
  function relativeLuminance(r, g, b) {
    return [r, g, b].map(v => {
      v /= 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    }).reduce((acc, v, i) => acc + v * [0.2126, 0.7152, 0.0722][i], 0);
  }
  function contrastRatio(hex1, hex2) {
    const [r1,g1,b1] = hexToRgb(hex1);
    const [r2,g2,b2] = hexToRgb(hex2);
    const L1 = relativeLuminance(r1,g1,b1);
    const L2 = relativeLuminance(r2,g2,b2);
    const lighter = Math.max(L1, L2);
    const darker  = Math.min(L1, L2);
    return (lighter + 0.05) / (darker + 0.05);
  }
  function ensureContrast(bgHex, textHex, minRatio) {
    // Incrementally lighten text toward #FFFFFF until contrast meets minRatio
    let [r, g, b] = hexToRgb(textHex);
    let attempts = 0;
    while (contrastRatio(bgHex, rgbToHex(r,g,b)) < minRatio && attempts < 255) {
      r = Math.min(255, r + 3);
      g = Math.min(255, g + 3);
      b = Math.min(255, b + 3);
      attempts++;
    }
    return rgbToHex(r, g, b);
  }
  function rgbToHex(r, g, b) {
    return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
  }

  function isDark(hex) {
    const c = hex.replace('#', '');
    const r = parseInt(c.substring(0, 2), 16);
    const g = parseInt(c.substring(2, 4), 16);
    const b = parseInt(c.substring(4, 6), 16);
    return (r * 0.299 + g * 0.587 + b * 0.114) < 140;
  }

  loadStories();
</script>

</body>
</html>
