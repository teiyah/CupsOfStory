<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cups of Story</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LRSCFV12XM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-LRSCFV12XM');
  </script>

  <!-- Favicon -->
  <link rel="icon" href="images/cosLogo.png">

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/26e7e163d1.js" crossorigin="anonymous"></script>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      background-color: #353530;
      color: #e8d9b0;
    }
    /* Navbar */
    .navbar {
      background-color: #353530 !important;
      border-bottom: 1px solid #4a4a44;
    }
    .navbar-toggler {
      border-color: #e8d9b0;
    }
    .navbar-toggler-icon {
      filter: invert(1);
    }
    /* Collapsed nav panel */
    #navbarHeader {
      background-color: #2a2a26 !important;
    }
    /* Hero */
    .hero-section h1 {
      color: #e8d9b0;
    }
    .hero-section p {
      color: #b8a882;
    }
    /* Cards grid background */
    .album {
      background-color: #353530 !important;
    }
    /* Cards */
    .card {
      background-color: #2a2a26;
      border: 1px solid #4a4a44;
    }
    .card-body {
      background-color: #2a2a26;
      padding: 0.6rem 0.75rem;
    }
    /* Opening line text on tile */
    .card-opening-line {
      font-size: 0.78rem;
      color: #b8a882;
      font-style: italic;
      margin: 0 0 0.25rem 0;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    /* Word count */
    .card-body small {
      color: #7a7060;
    }
    /* Entire tile clickable */
    .story-card-tile {
      cursor: pointer;
      display: block;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }
    .story-card-tile:hover {
      opacity: 0.85;
    }
    /* Footer */
    footer {
      background-color: #2a2a26 !important;
      border-top: 1px solid #4a4a44 !important;
      color: #7a7060 !important;
    }
    footer a {
      color: #b8a882 !important;
    }
    footer a:hover {
      color: #e8d9b0 !important;
    }
    /* Modal */
    .modal-content {
      background-color: #2a2a26;
      border: 1px solid #4a4a44;
    }
    .modal-body {
      color: #e8d9b0;
    }
    .modal-body p {
      line-height: 1.75;
      margin-bottom: 1rem;
    }
    .modal-footer {
      border-top: 1px solid #4a4a44;
      background-color: #2a2a26;
    }
  </style>
</head>

<body>

<!-- ===== NAVBAR ===== -->
<header>
  <div class="collapse" id="navbarHeader" style="background-color:#2a2a26;">
    <div class="container">
      <div class="row">

        <div class="col-sm-4 py-4">
          <h4 class="text-white">Index</h4>
          <ul class="list-unstyled" id="nav-index"></ul>
        </div>

        <div class="col-sm-4 py-4">
          <h4 class="text-white">Contact</h4>
          <ul class="list-unstyled">
            <li>
              <a href="https://www.instagram.com/cupsofstory/" target="_blank" class="text-white nav-links">
                <i class="fab fa-instagram"></i> Instagram
              </a>
            </li>
          </ul>
        </div>

      </div>
    </div>
  </div>

  <div class="navbar shadow-sm" style="background-color:#353530;">
    <div class="container">
      <a href="#" class="navbar-brand d-flex align-items-center"><strong></strong></a>
      <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse" data-bs-target="#navbarHeader"
        aria-controls="navbarHeader" aria-expanded="false" aria-label="Toggle navigation"
        style="border-color:#e8d9b0;">
        <span class="navbar-toggler-icon" style="filter:invert(1);"></span>
      </button>
    </div>
  </div>
</header>

<!-- ===== HERO ===== -->
<main>
  <section class="py-5 text-center container hero-section">
    <div class="row py-lg-5">
      <div class="col-lg-6 col-md-8 mx-auto">
        <img class="main-logo" src="images/cosLogo.png" alt="Cups of Story logo">
        <h1 class="fw-light" style="color:#e8d9b0;">Cups of Story</h1>
        <p class="lead" style="color:#b8a882;">Left nameless in the world.</p>
      </div>
    </div>
  </section>

  <!-- ===== CARDS GRID ===== -->
  <div class="album py-5" style="background-color:#353530;">
    <div class="container">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3" id="story-grid"></div>
    </div>
  </div>
</main>

<!-- ===== MODAL CONTAINER ===== -->
<div id="modal-container"></div>

<!-- ===== FOOTER ===== -->
<footer class="py-4" style="background-color:#2a2a26; border-top:1px solid #4a4a44;">
  <div class="container text-center">
    <p class="mb-1" style="color:#7a7060;">© Cups of Story</p>
    <small>
      <a href="https://www.instagram.com/cupsofstory/" target="_blank" style="color:#b8a882;">
        <i class="fab fa-instagram"></i> Instagram
      </a>
    </small>
  </div>
</footer>

<!-- ===== JAVASCRIPT ===== -->
<script>
  async function loadStories() {
    const res = await fetch('stories.json');
    const stories = await res.json();

    const grid = document.getElementById('story-grid');
    const modalContainer = document.getElementById('modal-container');
    const navIndex = document.getElementById('nav-index');

    // Build nav index in groups of ~10
    const groupSize = 10;
    const navRow = document.createElement('div');
    navRow.className = 'row';

    for (let i = 0; i < stories.length; i += groupSize) {
      const first = stories[i].id;
      const last = stories[Math.min(i + groupSize - 1, stories.length - 1)].id;
      const col = document.createElement('div');
      col.className = 'col-6 mb-1';
      col.innerHTML = `<li><a href="#cos-${first}" class="text-white nav-links"><i class="fas fa-coffee"></i> COS ${last} – ${first}</a></li>`;
      navRow.appendChild(col);
    }
    navIndex.appendChild(navRow);

    // Build cards + modals
    stories.forEach((story, index) => {
      const cosId = `cos${story.id}`;
      const isGroupStart = index % groupSize === 0;

      // Word count label
      const wordLabel = story.wordCount ? `${story.wordCount} words` : '';

      // Opening line: first non-empty sentence or first 80 chars
      const openingLine = story.text.split('\n')[0].substring(0, 90) + (story.text.length > 90 ? '…' : '');

      // Card — entire tile is clickable, no button
      const cardCol = document.createElement('div');
      cardCol.className = 'col';
      if (isGroupStart) cardCol.id = `cos-${story.id}`;

      cardCol.innerHTML = `
        <div class="card shadow-sm" style="background-color:#2a2a26; border:1px solid #4a4a44; overflow:hidden;">
          <a class="story-card-tile" data-bs-toggle="modal" data-bs-target="#${cosId}">
            <svg class="bd-placeholder-img card-img-top" width="100%" height="200"
              role="img" aria-label="COS ${story.id}"
              preserveAspectRatio="xMidYMid slice" focusable="false"
              xmlns="http://www.w3.org/2000/svg">
              <title>COS ${story.id}</title>
              <rect width="100%" height="100%" fill="${story.backgroundColor}" />
              <text x="50%" y="50%" fill="${story.textColor}" dy=".3em"
                font-family="inherit" font-size="13" text-anchor="middle"
                font-style="italic">
                ${openingLine.length > 55 ? openingLine.substring(0, 55) + '…' : openingLine}
              </text>
            </svg>

          </a>
        </div>
      `;
      grid.appendChild(cardCol);

      // Format story text
      const formattedText = story.text
        .split('\n\n')
        .map(para => `<p>${para.replace(/\n/g, '<br>')}</p>`)
        .join('');

      // Next story logic: array is newest→oldest, reading goes oldest→newest (index decreases)
      const nextStory = stories[index - 1];
      const isLast = index === 0;
      const nextCosId = nextStory ? `cos${nextStory.id}` : null;

      // Modal HTML
      const modalDiv = document.createElement('div');
      modalDiv.innerHTML = `
        <div class="modal fade" id="${cosId}" tabindex="-1"
          aria-labelledby="${cosId}Label" aria-hidden="true">
          <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content" style="background-color:#2a2a26; border:1px solid #4a4a44;">
              <div class="modal-header" style="background-color:${story.backgroundColor}; border-bottom:none;">
                <h5 class="modal-title" id="${cosId}Label"
                  style="color:${story.textColor};">COS ${story.id}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"
                  aria-label="Close" style="filter:${isDark(story.backgroundColor) ? 'invert(1)' : 'none'};"></button>
              </div>
              <div class="modal-body" style="color:#e8d9b0;">${formattedText}</div>
              <div class="modal-footer" style="background-color:#2a2a26; border-top:1px solid #4a4a44;">
                <small style="color:#7a7060; margin-right:auto;">${wordLabel}</small>
                ${isLast
                  ? `<button type="button" class="btn next-story-btn" data-bs-dismiss="modal"
                      style="background-color:${story.backgroundColor};color:${story.textColor};border:none;">Close</button>`
                  : `<button type="button" class="btn next-story-btn"
                      data-bs-dismiss="modal"
                      data-next="#${nextCosId}"
                      style="background-color:${story.backgroundColor};color:${story.textColor};border:none;">Next Story →</button>`
                }
              </div>
            </div>
          </div>
        </div>
      `;
      modalContainer.appendChild(modalDiv);
    });
  }

  // Handle "Next Story" button
  document.getElementById('modal-container').addEventListener('click', function(e) {
    const btn = e.target.closest('.next-story-btn');
    if (!btn) return;
    const nextTarget = btn.getAttribute('data-next');
    if (!nextTarget) return;
    document.addEventListener('hidden.bs.modal', function handler() {
      document.removeEventListener('hidden.bs.modal', handler);
      const nextModalEl = document.querySelector(nextTarget);
      if (nextModalEl) {
        const body = nextModalEl.querySelector('.modal-body');
        if (body) body.scrollTop = 0;
        new bootstrap.Modal(nextModalEl).show();
      }
    });
  });

  // Helper: is hex color dark?
  function isDark(hex) {
    const c = hex.replace('#', '');
    const r = parseInt(c.substring(0, 2), 16);
    const g = parseInt(c.substring(2, 4), 16);
    const b = parseInt(c.substring(4, 6), 16);
    return (r * 0.299 + g * 0.587 + b * 0.114) < 140;
  }

  loadStories();
</script>

</body>
</html>
