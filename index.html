<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cups of Story</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LRSCFV12XM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-LRSCFV12XM');
  </script>

  <!-- Favicon -->
  <link rel="icon" href="images/cosLogo.png">

  <!-- Google Fonts: Cormorant Garamond -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/26e7e163d1.js" crossorigin="anonymous"></script>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    * { box-sizing: border-box; }

    body {
      background-color: #1C1408;
      color: #E8E0D0;
      margin: 0;
    }

    /* ===== TOP NAV BAR ===== */
    .top-nav {
      background-color: #1C1408;
      border-bottom: 1px solid #2e2a1e;
      padding: 0.6rem 0;
    }
    .top-nav .container {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 2rem;
    }
    .top-nav a {
      color: #9a8e78;
      text-decoration: none;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .top-nav a:hover {
      color: #E8E0D0;
    }
    /* Index dropdown trigger */
    .top-nav .index-toggle {
      cursor: pointer;
      position: relative;
    }
    .top-nav .index-toggle:hover {
      color: #E8E0D0;
    }
    /* Index dropdown panel */
    #indexDropdown {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      background-color: #1C1408;
      border: 1px solid #2e2a1e;
      padding: 1rem 1.5rem;
      z-index: 999;
      min-width: 200px;
    }
    #indexDropdown.open { display: block; }
    #indexDropdown a {
      display: block;
      color: #9a8e78;
      text-decoration: none;
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      padding: 0.2rem 0;
    }
    #indexDropdown a:hover { color: #E8E0D0; }

    /* ===== HERO ===== */
    .hero-section {
      padding: 2.5rem 1rem 1rem;
      text-align: center;
    }
    .hero-section h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 2.8rem;
      color: #E8E0D0;
      margin-bottom: 0.3rem;
      letter-spacing: 0.03em;
    }
    .hero-section p {
      font-size: 0.88rem;
      color: #9a8e78;
      font-weight: 300;
      margin-bottom: 0;
    }
    .main-logo {
      max-width: 80px;
      margin-bottom: 0.75rem;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    /* ===== CARDS GRID ===== */
    .album {
      background-color: #1C1408 !important;
      padding: 1.5rem 0 3rem;
    }

    /* ===== TILE ===== */
    .story-card-tile {
      cursor: pointer;
      display: block;
      text-decoration: none;
      background-color: #404038;
      border-radius: 0;
      border: none;
      overflow: hidden;
      transition: opacity 0.2s ease;
    }
    .story-card-tile:hover {
      opacity: 0.82;
    }
    /* Coloured SVG block */
    .story-card-tile svg {
      display: block;
    }
    /* Opening line text inside SVG handled inline */

    /* ===== FOOTER ===== */
    footer {
      background-color: #1C1408;
      border-top: 1px solid #2e2a1e;
      color: #5a5040;
      padding: 1.5rem 0;
    }
    footer a {
      color: #9a8e78;
      text-decoration: none;
    }
    footer a:hover { color: #E8E0D0; }

    /* ===== MODAL ===== */
    .modal-content {
      background-color: #1e1a10;
      border: 1px solid #2e2a1e;
      border-radius: 0;
    }
    .modal-body {
      color: #E8E0D0;
      line-height: 1.75;
    }
    .modal-body p {
      margin-bottom: 1rem;
    }
    .modal-footer {
      border-top: 1px solid #2e2a1e;
      background-color: #1e1a10;
    }
    .modal-header {
      border-bottom: none;
    }
  </style>
</head>

<body>

<!-- ===== TOP NAV ===== -->
<nav class="top-nav">
  <div class="container" style="position:relative;">
    <div class="index-toggle" id="indexToggle">Index ▾</div>
    <a href="https://www.instagram.com/cupsofstory/" target="_blank"><i class="fab fa-instagram"></i> Instagram</a>
    <div id="indexDropdown">
      <div id="nav-index-links"></div>
    </div>
  </div>
</nav>

<!-- ===== HERO ===== -->
<main>
  <section class="hero-section">
    <div class="col-lg-6 col-md-8 mx-auto">
      <img class="main-logo" src="images/cosLogo.png" alt="Cups of Story logo">
      <h1>Cups of Story</h1>
      <p>Left nameless in the world.</p>
    </div>
  </section>

  <!-- ===== CARDS GRID ===== -->
  <div class="album">
    <div class="container">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3" id="story-grid"></div>
    </div>
  </div>
</main>

<!-- ===== MODAL CONTAINER ===== -->
<div id="modal-container"></div>

<!-- ===== FOOTER ===== -->
<footer>
  <div class="container text-center">
    <p class="mb-1" style="color:#5a5040; font-size:0.8rem;">© Cups of Story</p>
    <small>
      <a href="https://www.instagram.com/cupsofstory/" target="_blank">
        <i class="fab fa-instagram"></i> Instagram
      </a>
    </small>
  </div>
</footer>

<!-- ===== JAVASCRIPT ===== -->
<script>
  // Index dropdown toggle
  document.getElementById('indexToggle').addEventListener('click', function(e) {
    e.stopPropagation();
    document.getElementById('indexDropdown').classList.toggle('open');
  });
  document.addEventListener('click', function() {
    document.getElementById('indexDropdown').classList.remove('open');
  });

  async function loadStories() {
    const res = await fetch('stories.json');
    const stories = await res.json();

    const grid = document.getElementById('story-grid');
    const modalContainer = document.getElementById('modal-container');
    const navLinks = document.getElementById('nav-index-links');

    // Build nav index in groups of ~10
    const groupSize = 10;
    for (let i = 0; i < stories.length; i += groupSize) {
      const first = stories[i].id;
      const last = stories[Math.min(i + groupSize - 1, stories.length - 1)].id;
      const a = document.createElement('a');
      a.href = `#cos-${first}`;
      a.textContent = `COS ${last} – ${first}`;
      a.addEventListener('click', () => document.getElementById('indexDropdown').classList.remove('open'));
      navLinks.appendChild(a);
    }

    // Build cards + modals
    stories.forEach((story, index) => {
      const cosId = `cos${story.id}`;
      const isGroupStart = index % groupSize === 0;

      const wordLabel = story.wordCount ? `${story.wordCount} words` : '';

      // Opening line — exact text from story, split at word boundary near char 38
      const rawLine = story.text.split('\n')[0];

      // Find the last space at or before char 38 to make line1
      let splitAt = 38;
      if (rawLine.length > 38) {
        // Walk back to nearest space
        while (splitAt > 0 && rawLine[splitAt] !== ' ') splitAt--;
      }
      const line1 = rawLine.substring(0, splitAt || rawLine.length).trim();
      const rest  = rawLine.substring(splitAt).trim();
      // line2: up to next 42 chars, ending at word boundary
      let line2end = Math.min(rest.length, 42);
      if (line2end < rest.length) {
        while (line2end > 0 && rest[line2end] !== ' ') line2end--;
      }
      const line2 = rest.substring(0, line2end).trim();

      const svgText = line2
        ? `<tspan x="50%" dy="-0.6em">${line1}</tspan><tspan x="50%" dy="1.4em">${line2}</tspan>`
        : `<tspan x="50%" dy="0">${line1}</tspan>`;

      // Card
      const cardCol = document.createElement('div');
      cardCol.className = 'col';
      if (isGroupStart) cardCol.id = `cos-${story.id}`;

      cardCol.innerHTML = `
        <a class="story-card-tile" data-bs-toggle="modal" data-bs-target="#${cosId}">
          <svg class="bd-placeholder-img" width="100%" height="210"
            role="img" aria-label="COS ${story.id}"
            preserveAspectRatio="xMidYMid slice" focusable="false"
            xmlns="http://www.w3.org/2000/svg">
            <rect width="100%" height="100%" fill="${story.backgroundColor}" />
            <text x="50%" y="50%" fill="${story.textColor}"
              font-family="Georgia, serif" font-size="13.5" text-anchor="middle"
              font-weight="normal">
              ${svgText}
            </text>
          </svg>
        </a>
      `;
      grid.appendChild(cardCol);

      // Format story text
      const formattedText = story.text
        .split('\n\n')
        .map(para => `<p>${para.replace(/\n/g, '<br>')}</p>`)
        .join('');

      // Next story: array is newest→oldest, reading is oldest→newest
      const nextStory = stories[index - 1];
      const isLast = index === 0;
      const nextCosId = nextStory ? `cos${nextStory.id}` : null;

      const modalDiv = document.createElement('div');
      modalDiv.innerHTML = `
        <div class="modal fade" id="${cosId}" tabindex="-1"
          aria-labelledby="${cosId}Label" aria-hidden="true">
          <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">
              <div class="modal-header" style="background-color:${story.backgroundColor};">
                <h5 class="modal-title" style="color:${story.textColor}; font-family:'Cormorant Garamond',serif; font-weight:600;">COS ${story.id}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"
                  aria-label="Close" style="filter:${isDark(story.backgroundColor) ? 'invert(1)' : 'none'};"></button>
              </div>
              <div class="modal-body">${formattedText}</div>
              <div class="modal-footer">
                <small style="color:#5a5040; margin-right:auto;">${wordLabel}</small>
                ${isLast
                  ? `<button type="button" class="btn next-story-btn" data-bs-dismiss="modal"
                      style="background-color:${story.backgroundColor};color:${story.textColor};border:none;border-radius:0;">Close</button>`
                  : `<button type="button" class="btn next-story-btn"
                      data-bs-dismiss="modal" data-next="#${nextCosId}"
                      style="background-color:${story.backgroundColor};color:${story.textColor};border:none;border-radius:0;">Next Story →</button>`
                }
              </div>
            </div>
          </div>
        </div>
      `;
      modalContainer.appendChild(modalDiv);
    });
  }

  // Next Story button handler
  document.getElementById('modal-container').addEventListener('click', function(e) {
    const btn = e.target.closest('.next-story-btn');
    if (!btn) return;
    const nextTarget = btn.getAttribute('data-next');
    if (!nextTarget) return;
    document.addEventListener('hidden.bs.modal', function handler() {
      document.removeEventListener('hidden.bs.modal', handler);
      const nextModalEl = document.querySelector(nextTarget);
      if (nextModalEl) {
        const body = nextModalEl.querySelector('.modal-body');
        if (body) body.scrollTop = 0;
        new bootstrap.Modal(nextModalEl).show();
      }
    });
  });

  function isDark(hex) {
    const c = hex.replace('#', '');
    const r = parseInt(c.substring(0, 2), 16);
    const g = parseInt(c.substring(2, 4), 16);
    const b = parseInt(c.substring(4, 6), 16);
    return (r * 0.299 + g * 0.587 + b * 0.114) < 140;
  }

  loadStories();
</script>

</body>
</html>
